<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="orbit-title orbit-desc">
  <title id="orbit-title">Orbit CRM</title>
  <desc id="orbit-desc">Abstract orbital customer network visualization.</desc>
  <defs>
