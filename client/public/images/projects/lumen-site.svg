<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="lumen-title lumen-desc">
  <title id="lumen-title">Lumen Site</title>
  <desc id="lumen-desc">Abstract editorial website composition with radiant geometry.</desc>
  <defs>
    <linearGradient id="lumen-bg" x1="82" y1="24" x2="729" y2="481" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12263E"/>
      <stop offset=".52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#03070E"/>
    </linearGradient>
    <linearGradient id="lumen-light" x1="273" y1="104" x2="564" y2="369" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFF9"/>
      <stop offset=".37" stop-color="#00C2B8"/>
      <stop offset="1" stop-color="#3D7EFF"/>
    </linearGradient>
    <filter id="lumen-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#lumen-bg)"/>
